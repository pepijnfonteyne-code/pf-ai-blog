baseURL = "https://pepijnfonteyne-code.github.io/pf-ai-blog/"
languageCode = "nl-be"
title = "P&F AI Blog"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "P&F AI Blog"
  description = "Dagelijks kwalitatief nieuws over AI, Claude Code, automatisering en AI in business — voor ondernemers die voorop willen lopen."
  keywords = ["AI", "Claude Code", "automatisering", "ChatGPT", "business AI", "Panis & Fonteyne"]
  author = "P&F Consulting"
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "P&F AI Blog"
    Content = "Elke dag een diepgaand artikel over de nieuwste ontwikkelingen in AI — voor ondernemers, consultants en iedereen die de trein niet wil missen. Door Panis & Fonteyne Consulting."

  [[params.socialIcons]]
    name = "email"
    url = "mailto:pepijn.fonteyne@gmail.com"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[menu]
  [[menu.main]]
    identifier = "articles"
    name = "Artikelen"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"

[outputs]
  home = ["HTML", "RSS", "JSON"]
