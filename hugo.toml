baseURL = "https://pepijnfonteyne-code.github.io/pf-ai-blog/"
languageCode = "nl-be"
title = "P&F AI Blog"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "P&F AI Blog"
  description = "Dagelijks technisch AI-overzicht — Claude Code, OpenAI, Gemini, Hermes, open source. Voor Pepijn & Duncan van P&F Consulting."
  keywords = ["AI", "Claude Code", "OpenAI", "Gemini", "Hermes", "open source AI", "agentic workflows", "MCP"]
  author = "P&F Consulting"
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "P&F AI Blog"
    Content = "Dagelijks technisch AI-overzicht voor Pepijn & Duncan van P&F Consulting. Claude Code, OpenAI, Gemini, Hermes, open source — wat er bewoog, hoe het werkt, hoe je het toepast."

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[menu]
  [[menu.main]]
    identifier = "articles"
    name = "Artikelen"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archief"
    name = "Archief"
    url = "/archief/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"

[outputs]
  home = ["HTML", "RSS", "JSON"]
